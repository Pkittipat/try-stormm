schemaVersion: 1
id: untitled-process
name: Untitled process

blocks:
  - { id: new-read-model, kind: readmodel, title: Job Detail }
  - { id: new-command, kind: command, title: Publish Job }
  - id: new-aggregate
    kind: aggregate
    title: Job
    fields:
      - { name: id, type: string }
      - { name: name, type: string }
  - { id: new-event, kind: event, title: Job Published }
  - { id: new-policy-2, kind: policy, title: "Whenever job published, record activity log" }
  - id: job-summary
    kind: readmodel
    title: Job Summary
    fields:
      - { name: id, type: string }

connections:
  - { from: new-read-model, to: new-command }
  - { from: new-command, to: new-aggregate }
  - { from: new-aggregate, to: new-event }
  - { from: new-event, to: new-policy-2 }
  - { from: new-event, to: job-summary }
